<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Punchclock Client</title>
        <link rel="stylesheet" type="text/css" href="style.css" />
        <script src="script.js" type="application/javascript"></script>
    </head>
    <body>
        <h2>Create entry</h2>
        <form id="createEntryForm">
            <label for="checkIn">Check in</label>
            <div class="datetime">
                <input type="date" name="checkInDate" id="checkIn" required>
                <input type="time" name="checkInTime" required>
            </div>
            <label for="checkOut">Check out</label>
            <div class="datetime">
                <input type="date" name="checkOutDate" id="checkOut" required>
                <input type="time" name="checkOutTime" required>
            </div>
            <label for="createCategory">Category</label>
            <select name="categorySelect" id="createCategory" class="categorySelect"></select>
            <label for="createTags">Tags</label>
            <select name="tagIds" id="createTags" class="tagSelect" multiple></select>
            <input type="submit" value="Create" />
        </form>

        <h2>Edit entry</h2>
        <form id="editEntryForm">
            <label for="editId">ID</label>
            <input type="text" name="id" id="editId" readonly required>
            <label for="editCheckIn">Check in</label>
            <div class="datetime">
                <input type="date" name="checkInDate" id="editCheckIn" required>
                <input type="time" name="checkInTime" required>
            </div>
            <label for="editCheckOut">Check out</label>
            <div class="datetime">
                <input type="date" name="checkOutDate" id="editCheckOut" required>
                <input type="time" name="checkOutTime" required>
            </div>
            <label for="editCategory">Category</label>
            <select name="categorySelect" id="editCategory" class="categorySelect"></select>
            <label for="editTags">Tags</label>
            <select name="tagIds" id="editTags" class="tagSelect" multiple></select>
            <input type="submit" value="Save" />
        </form>

        <h2>Entries</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Check in</th>
                    <th>Check out</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="entryDisplay">
                <tr>
                    <td colspan="4">Loading...</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
